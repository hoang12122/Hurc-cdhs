per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /run/pki/ca/ca.crt
certfile /run/pki/broker/tls.crt
keyfile /run/pki/broker/tls.key
crlfile /run/pki/ca/device-crl.pem
tls_version tlsv1.3

# Device identities are mapped from certificate CN/SAN to ACL entries.
acl_file /run/pki/policy/device-acl

# Management listener remains private and must be isolated by the internal network.
listener 1884 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /run/secrets/mqtt_admin_password_file
