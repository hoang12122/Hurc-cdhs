# Development/POC configuration only.
# Production must replace anonymous access with mTLS or per-device credentials.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883 0.0.0.0
allow_anonymous true

# Runtime hard limits. Application-level validation remains authoritative.
message_size_limit 1048576
max_queued_messages 10000
max_inflight_messages 100
max_connections 1000
