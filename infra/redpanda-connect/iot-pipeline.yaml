input:
  mqtt:
    urls:
      - tcp://mqtt:1883
    client_id: hurc-redpanda-connect
    topics:
      - hurc/+/+/+/+/+/telemetry
    qos: 1
    clean_session: false
    auto_replay_nacks: true

pipeline:
  processors:
    - mapping: |
        root = this
        root._mqttTopic = metadata("mqtt_topic")
        root._ingestedAt = now()
        meta event_id = this.eventId.or(uuid_v4())

output:
  broker:
    pattern: fan_out
    outputs:
      - kafka_franz:
          seed_brokers:
            - redpanda:9092
          client_id: hurc-iot-bronze
          topic: iot.telemetry.raw
          key: ${! this.eventId.or(metadata("event_id")) }
          max_in_flight: 20
          batching:
            count: 500
            period: 500ms
      - aws_s3:
          bucket: hurc-raw
          path: bronze/telemetry/ingest_date=${! now().format("2006-01-02") }/hour=${! now().format("15") }/batch-${! uuid_v4() }.json
          endpoint: http://minio:9000
          force_path_style_urls: true
          region: us-east-1
          credentials:
            id: ${MINIO_ROOT_USER}
            secret: ${MINIO_ROOT_PASSWORD}
          max_in_flight: 16
          batching:
            count: 1000
            period: 10s
            processors:
              - archive:
                  format: json_array
