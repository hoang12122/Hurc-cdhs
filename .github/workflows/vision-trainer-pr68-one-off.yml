name: Vision Trainer PR 68 One-off Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vision-trainer-pr68-one-off.yml'
      - 'infra/vision-trainer/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build vision-trainer image
        run: docker build -f infra/vision-trainer/Dockerfile -t hurc-vision-trainer:pr68 .

      - name: Start MLflow and vision-trainer
        run: |
          docker network create vision-pr68
          docker run -d --name mlflow-pr68 --network vision-pr68 --network-alias mlflow -p 5001:5000 \
            -e MLFLOW_SERVER_ALLOWED_HOSTS='mlflow:5000,mlflow-pr68:5000,localhost:*,127.0.0.1:*' \
            ghcr.io/mlflow/mlflow:v3.15.1 \
            mlflow server --host 0.0.0.0 --port 5000 \
            --backend-store-uri sqlite:////tmp/mlflow.db \
            --default-artifact-root /tmp/artifacts --serve-artifacts
          docker run -d --name vision-pr68 --network vision-pr68 -p 8090:8090 \
            -e VISION_TRAINER_TOKEN=pr68-smoke-token-with-32-characters \
            -e VISION_TRAINING_ENABLED=true \
            -e VISION_MIN_APPROVED_PER_CLASS=1 \
            -e VISION_MAX_EPOCHS=1 \
            -e VISION_ALLOWED_BASE_MODELS=yolo11n.pt \
            -e MLFLOW_TRACKING_URI=http://mlflow:5000 \
            hurc-vision-trainer:pr68

      - name: Wait for service health
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8090/health; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' vision-pr68 | grep -q true; then
              docker logs vision-pr68
              exit 1
            fi
            sleep 2
          done
          docker logs vision-pr68
          exit 1

      - name: Create dataset, upload samples, and run one epoch
        shell: bash
        run: |
          set -euo pipefail
          token='pr68-smoke-token-with-32-characters'
          auth="Authorization: Bearer ${token}"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYElEQVR4nO3PQQ0AIBDAMMC/50MEj4ZkVbDtmVk/OzrgVQNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgPaBXKqA31N0fbGAAAAAElFTkSuQmCC' | base64 --decode > smoke.png

          dataset_json=$(curl --fail --silent --show-error -X POST \
            -H "${auth}" -H 'Content-Type: application/json' \
            -d '{"name":"PR 68 smoke","classes":["defect"],"description":"Dependency compatibility smoke"}' \
            http://127.0.0.1:8090/datasets)
          dataset_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"${dataset_json}")

          upload_and_approve() {
            local split="$1"
            local sample_json sample_id
            sample_json=$(curl --fail --silent --show-error -X POST \
              -H "${auth}" \
              -F 'image=@smoke.png;type=image/png' \
              -F 'annotations=[{"classId":0,"x":0.5,"y":0.5,"width":0.5,"height":0.5}]' \
              -F "split=${split}" -F 'source=pr68-ci' \
              "http://127.0.0.1:8090/datasets/${dataset_id}/samples")
            sample_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"${sample_json}")
            curl --fail --silent --show-error -X POST \
              -H "${auth}" -H 'Content-Type: application/json' \
              -d '{"note":"PR 68 compatibility smoke"}' \
              "http://127.0.0.1:8090/samples/${sample_id}/approve" >/dev/null
          }

          upload_and_approve train
          upload_and_approve val

          job_json=$(curl --fail --silent --show-error -X POST \
            -H "${auth}" -H 'Content-Type: application/json' \
            -d "{\"datasetId\":\"${dataset_id}\",\"baseModel\":\"yolo11n.pt\",\"epochs\":1,\"imageSize\":320,\"batchSize\":1}" \
            http://127.0.0.1:8090/training/jobs)
          job_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"${job_json}")

          for attempt in $(seq 1 120); do
            job_json=$(curl --fail --silent --show-error -H "${auth}" \
              "http://127.0.0.1:8090/training/jobs/${job_id}")
            status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"${job_json}")
            case "${status}" in
              SUCCEEDED_REVIEW_REQUIRED)
                echo "Training smoke succeeded: ${job_json}"
                curl --fail --silent http://127.0.0.1:5001/api/2.0/mlflow/experiments/search >/dev/null
                exit 0
                ;;
              FAILED)
                echo "Training smoke failed: ${job_json}"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Training smoke timed out: ${job_json}"
          exit 1

      - name: Print service logs
        if: always()
        run: |
          docker logs vision-pr68 || true
          docker logs mlflow-pr68 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f vision-pr68 mlflow-pr68 || true
          docker network rm vision-pr68 || true
