name: Vision, SCADA and Data Exchange Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vision-scada-data-exchange.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/vision-trainer/**'
      - 'infra/scada-gateway/**'
      - 'docker-compose.vision-scada.yml'
      - 'docker-compose.platform-production-images.yml'
      - 'scripts/platform-compose.mjs'
      - 'scripts/check-platform-image-pins.mjs'
      - 'scripts/check-vision-scada-contracts.mjs'
      - 'scripts/check-operational-performance-invariants.mjs'
      - 'src/app/api/vision-training/**'
      - 'src/app/api/data-exchange/**'
      - 'src/app/(app)/dnf/**'
      - 'src/app/(app)/hazards/**'
      - 'src/components/ai/vision-training-studio.tsx'
      - 'src/components/admin/operational-data-exchange.tsx'
      - 'src/components/ui/operational-list-loading.tsx'
      - 'src/lib/actions/dnf.actions.ts'
      - 'src/lib/actions/hazard.actions.ts'
      - 'src/lib/auth-enforcer.ts'
      - 'src/lib/services/auth-service.ts'
      - 'src/lib/services/ou-scope-service.ts'
      - 'src/lib/services/data-exchange/**'
      - 'src/scripts/test-data-exchange.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vision-scada-data-exchange.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/vision-trainer/**'
      - 'infra/scada-gateway/**'
      - 'docker-compose.vision-scada.yml'
      - 'docker-compose.platform-production-images.yml'
      - 'scripts/platform-compose.mjs'
      - 'scripts/check-platform-image-pins.mjs'
      - 'scripts/check-vision-scada-contracts.mjs'
      - 'scripts/check-operational-performance-invariants.mjs'
      - 'src/app/api/vision-training/**'
      - 'src/app/api/data-exchange/**'
      - 'src/app/(app)/dnf/**'
      - 'src/app/(app)/hazards/**'
      - 'src/components/ai/vision-training-studio.tsx'
      - 'src/components/admin/operational-data-exchange.tsx'
      - 'src/components/ui/operational-list-loading.tsx'
      - 'src/lib/actions/dnf.actions.ts'
      - 'src/lib/actions/hazard.actions.ts'
      - 'src/lib/auth-enforcer.ts'
      - 'src/lib/services/auth-service.ts'
      - 'src/lib/services/ou-scope-service.ts'
      - 'src/lib/services/data-exchange/**'
      - 'src/scripts/test-data-exchange.ts'

concurrency:
  group: vision-scada-data-exchange-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      # The repository intentionally has no committed package-lock.json.
      # Cache npm's download store using package.json as the invalidation key.
      - name: Cache npm download artifacts
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-20.12.2-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-20.12.2-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --include=dev --ignore-scripts --no-audit --fund=false --package-lock=false --prefer-offline

      - name: Validate Compose overlays
        run: npm run platform:config

      - name: Verify safety contracts
        run: node scripts/check-vision-scada-contracts.mjs

      - name: Compile Python services
        run: python3 -m py_compile infra/vision-trainer/main.py infra/scada-gateway/main.py

      - name: Verify DNF and Hazard CSV contract
        run: npx tsx src/scripts/test-data-exchange.ts

      - name: Verify operational performance invariants
        run: node scripts/check-operational-performance-invariants.mjs

      - name: Static type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint