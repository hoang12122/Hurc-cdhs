name: Security and Acceptance Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-quality-gate:
    name: Security, Typecheck, AI Governance, Learning, ETL, Platform Profiles, Twin, Lint, Build, Smoke Test and Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_RUNTIME_PROFILE: STANDARD
      AI_ASSURANCE_PROFILE: STANDARD
      DATA_PLATFORM_PHASE: '0'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      - name: Install dependencies
        run: node scripts/run-build-phase.js "Install dependencies" -- npm install --include=dev --ignore-scripts

      - name: Verify Prisma dependency contract
        run: node scripts/run-build-phase.js "Verify Prisma dependency contract" -- npm run db:verify:prisma-version

      - name: Design rules file-size boundary
        run: node scripts/run-build-phase.js "Design rules file-size boundary" -- node scripts/check-file-size-boundaries.js --warn

      - name: Changed-file design boundary gate
        run: node scripts/run-build-phase.js "Changed-file design boundary gate" -- node scripts/check-changed-file-size-boundaries.js

      - name: Vibe Code rules audit
        run: node scripts/run-build-phase.js "Vibe Code rules audit" -- node scripts/check-vibe-code-rules.js --warn

      - name: Module import boundary audit
        run: node scripts/run-build-phase.js "Module import boundary audit" -- node scripts/audit-module-boundaries.js

      - name: Module registry audit
        run: node scripts/run-build-phase.js "Module registry audit" -- node scripts/audit-module-registry.js

      - name: Developer Guide traceability audit
        run: node scripts/run-build-phase.js "Developer Guide traceability audit" -- node scripts/audit-developer-guide.js

      - name: Deployment and Ops evidence audit
        run: node scripts/run-build-phase.js "Deployment and Ops evidence audit" -- node scripts/audit-doc4.js

      - name: Secure integration evidence audit
        run: node scripts/run-build-phase.js "Secure integration evidence audit" -- node scripts/audit-secure-integrations.js

      - name: Lifecycle documentation audit
        run: node scripts/run-build-phase.js "Lifecycle documentation audit" -- node scripts/audit-lifecycle-docs.js

      - name: openMAINT benchmark evidence audit
        run: node scripts/run-build-phase.js "openMAINT benchmark evidence audit" -- node scripts/audit-openmaint-benchmark.js

      - name: Software linkage audit
        run: node scripts/run-build-phase.js "Software linkage audit" -- npm run audit:linkage

      - name: Six-step upgrade audit
        run: node scripts/run-build-phase.js "Six-step upgrade audit" -- node scripts/audit-six-step-upgrades.js

      - name: Core workflow logic audit
        run: node scripts/run-build-phase.js "Core workflow logic audit" -- node scripts/audit-core-workflow-logic.js

      - name: Converged platform compose validation
        run: node scripts/run-build-phase.js "Converged platform compose validation" -- npm run platform:config

      - name: ETL architecture invariant checks
        run: node scripts/run-build-phase.js "ETL architecture invariant checks" -- node scripts/check-etl-architecture.mjs

      - name: ETL Python syntax checks
        run: >-
          node scripts/run-build-phase.js "ETL Python syntax checks" -- python3 -m py_compile
          infra/etl-normalizer/contract.py infra/etl-normalizer/registry.py infra/etl-normalizer/main.py
          infra/timescale-sink/store.py infra/timescale-sink/main.py
          infra/etl-replay-worker/config.py infra/etl-replay-worker/control.py
          infra/etl-replay-worker/replay.py infra/etl-replay-worker/main.py
          infra/etl-replay-worker/test_replay.py infra/iot-ingestor/entrypoint.py

      - name: ETL contract invariant checks
        run: node scripts/run-build-phase.js "ETL contract invariant checks" -- python3 -m unittest infra/etl-normalizer/test_contract.py

      - name: ETL replay policy checks
        run: node scripts/run-build-phase.js "ETL replay policy checks" -- python3 -m unittest infra/etl-replay-worker/test_replay.py

      - name: Static type check
        run: node scripts/run-build-phase.js "Static type check" -- npm run typecheck

      - name: AI governance invariant checks
        run: node scripts/run-build-phase.js "AI governance invariant checks" -- npm run test:ai-governance

      - name: AI executable profile invariant checks
        run: node scripts/run-build-phase.js "AI executable profile invariant checks" -- npm run test:ai-profiles

      - name: Continuous learning safety invariant checks
        run: node scripts/run-build-phase.js "Continuous learning safety invariant checks" -- npm run test:continuous-learning

      - name: Converged platform phase invariant checks
        run: node scripts/run-build-phase.js "Converged platform phase invariant checks" -- npm run test:platform-profiles

      - name: Digital Twin health invariant checks
        run: node scripts/run-build-phase.js "Digital Twin health invariant checks" -- npm run test:digital-twin-health

      - name: Platform production readiness invariant checks
        run: node scripts/run-build-phase.js "Platform production readiness invariant checks" -- npm run test:platform-readiness

      - name: Next.js lint
        run: node scripts/run-build-phase.js "Next.js lint" -- npm run lint

      - name: Production build
        run: node scripts/run-build-phase.js "Production build" -- npm run build
        env:
          NEXT_PUBLIC_SETUP_COMPLETE: 'true'
          SESSION_SECRET: ci_placeholder_session_value
          AUTH_DATABASE_URL: postgresql://build:placeholder@localhost:5432/auth
          AI_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ai
          METRO_DATABASE_URL: postgresql://build:placeholder@localhost:5432/metro
          OPS_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ops
          DATABASE_URL: postgresql://build:placeholder@localhost:5432/main

      - name: Production route smoke test
        run: node scripts/run-build-phase.js "Production route smoke test" -- node scripts/production-smoke-test.js
        env:
          NEXT_PUBLIC_SETUP_COMPLETE: 'true'
          SESSION_SECRET: ci_placeholder_session_value
          AUTH_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/auth
          AI_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/ai
          METRO_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/metro
          OPS_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/ops
          DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/main

      - name: Production dependency audit
        run: node scripts/run-build-phase.js "Production dependency audit" -- node scripts/production-dependency-audit.js
        env:
          PRODUCTION_AUDIT_FAIL_LEVELS: high,critical

      - name: Upload build phase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-phase-logs-${{ github.run_id }}
          path: .build-logs/
          if-no-files-found: ignore

  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
