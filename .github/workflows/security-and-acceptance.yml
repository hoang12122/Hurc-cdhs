name: Security and Acceptance Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - feature/**

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-quality-gate:
    name: Build, Typecheck, Spatial Import, Smoke Test and Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --include=dev --ignore-scripts

      - name: Design rules file-size boundary
        run: node scripts/check-file-size-boundaries.js --warn

      - name: Changed-file design boundary gate
        run: node scripts/check-changed-file-size-boundaries.js

      - name: Vibe Code rules audit
        run: node scripts/check-vibe-code-rules.js --warn

      - name: Module import boundary audit
        run: node scripts/audit-module-boundaries.js

      - name: Module registry audit
        run: node scripts/audit-module-registry.js

      - name: Developer Guide traceability audit
        run: node scripts/audit-developer-guide.js

      - name: Deployment and Ops evidence audit
        run: node scripts/audit-doc4.js

      - name: Secure integration evidence audit
        run: node scripts/audit-secure-integrations.js

      - name: Lifecycle documentation audit
        run: node scripts/audit-lifecycle-docs.js

      - name: openMAINT benchmark evidence audit
        run: node scripts/audit-openmaint-benchmark.js

      - name: Software linkage audit
        run: npm run audit:linkage

      - name: Validate Prisma schemas
        run: npm run db:validate:all
        env:
          AUTH_DATABASE_URL: postgresql://build:placeholder@localhost:5432/auth
          AI_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ai
          METRO_DATABASE_URL: postgresql://build:placeholder@localhost:5432/metro
          OPS_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ops
          DATABASE_URL: postgresql://build:placeholder@localhost:5432/main

      - name: Generate Prisma clients
        run: npm run db:generate:all
        env:
          AUTH_DATABASE_URL: postgresql://build:placeholder@localhost:5432/auth
          AI_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ai
          METRO_DATABASE_URL: postgresql://build:placeholder@localhost:5432/metro
          OPS_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ops
          DATABASE_URL: postgresql://build:placeholder@localhost:5432/main

      - name: GIS/BIM import dry-run validation
        run: npm run import:gis-bim:dry-run

      - name: Static type check
        run: npm run typecheck

      - name: Next.js lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SETUP_COMPLETE: 'true'
          SESSION_SECRET: ci_placeholder_secret_for_acceptance_gate
          AUTH_DATABASE_URL: postgresql://build:placeholder@localhost:5432/auth
          AI_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ai
          METRO_DATABASE_URL: postgresql://build:placeholder@localhost:5432/metro
          OPS_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ops
          DATABASE_URL: postgresql://build:placeholder@localhost:5432/main

      - name: Production route smoke test
        run: node scripts/production-smoke-test.js
        env:
          NEXT_PUBLIC_SETUP_COMPLETE: 'true'
          SESSION_SECRET: ci_placeholder_secret_for_smoke_test
          AUTH_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/auth
          AI_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/ai
          METRO_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/metro
          OPS_DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/ops
          DATABASE_URL: postgresql://smoke:placeholder@localhost:5432/main

      - name: Production dependency audit
        run: npm audit --audit-level=high --omit=dev

  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
