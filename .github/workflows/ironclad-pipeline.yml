name: HURC1 IRONCLAD CI/CD PIPELINE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit_and_build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 🟢 Verify Node.js and npm versions (Strict Invariant Check)
        run: |
          if [ ! -f ".nvmrc" ]; then
            echo "❌ Error: .nvmrc file not found!"
            exit 1
          fi
          EXPECTED_NODE=$(cat .nvmrc | tr -d '\r' | tr -d ' ' | sed 's/^v//')
          ACTUAL_NODE=$(node -v | sed 's/^v//')
          echo "Expected Node version: v$EXPECTED_NODE"
          echo "Actual Node version: v$ACTUAL_NODE"
          if [ "$ACTUAL_NODE" != "$EXPECTED_NODE" ]; then
            echo "❌ Node.js version mismatch!"
            exit 1
          fi
          
          ACTUAL_NPM=$(npm -v)
          echo "Actual npm version: $ACTUAL_NPM"
          NPM_MAJOR=$(echo "$ACTUAL_NPM" | cut -d. -f1)
          echo "Actual npm major version: $NPM_MAJOR"
          if [ "$NPM_MAJOR" != "10" ]; then
            echo "❌ npm version is not in range >=10 <11 (Major version must be 10)!"
            exit 1
          fi
          echo "✅ Node.js and npm versions verified successfully!"

      - name: 📦 Install Dependencies
        run: npm install --include=dev --ignore-scripts

      - name: 🔒 Verify Prisma Dependency Contract
        run: npm run db:verify:prisma-version

      - name: ⚙️ Generate Prisma Clients
        run: npm run db:generate:all

      - name: 🧪 Run Typecheck
        run: npm run typecheck

      - name: 🔍 Run Linting
        run: npm run lint

      - name: 🏗️ Verify Next.js Build
        run: npm run build
        env:
          IS_DATABASE_OFFLINE: true

      - name: 🔍 Deep Logic Audit (Mission Critical)
        run: |
          mkdir -p audit_reports
          npx tsx src/scripts/pre-deploy-audit.ts
        env:
          IS_DATABASE_OFFLINE: true

      - name: 🛡️ Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: 🏗️ Build Hardened Docker Image
        run: |
          docker build -t hurc1-crm:latest .

      - name: ⚙️ Initialize Environment File (.env)
        run: cp .env.example .env

      - name: 🟢 Start Core Services (Tiered Deploy)
        run: |
          docker compose --profile core up -d

      - name: 🧪 Run Core Smoke Test Gate (Mandatory)
        run: |
          bash scripts/smoke-deploy.sh core

      - name: 🔵 Start AI Services (Tiered Deploy - Optional)
        id: ai_start
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ai-ci-logs
          docker compose --profile ai up -d 2>&1 | tee ai-ci-logs/compose-up.log
          docker compose --profile ai ps -a 2>&1 | tee ai-ci-logs/compose-ps-after-start.log

      - name: 🧪 Run AI Smoke Test Gate (Optional Verification)
        id: ai_smoke
        if: steps.ai_start.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ai-ci-logs
          bash scripts/smoke-deploy.sh ai 2>&1 | tee ai-ci-logs/smoke-ai.log

      - name: 🧾 Collect AI Runtime Diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ai-ci-logs
          docker compose --profile ai ps -a > ai-ci-logs/compose-ps-final.log 2>&1 || true
          docker compose --profile ai logs --no-color --tail 500 > ai-ci-logs/compose-ai.log 2>&1 || true
          {
            echo "ai_start_outcome=${{ steps.ai_start.outcome }}"
            echo "ai_smoke_outcome=${{ steps.ai_smoke.outcome }}"
            echo "docker_version=$(docker --version 2>/dev/null || true)"
            echo "compose_version=$(docker compose version 2>/dev/null || true)"
          } > ai-ci-logs/outcomes.txt

          if [ "${{ steps.ai_start.outcome }}" != "success" ] || [ "${{ steps.ai_smoke.outcome }}" = "failure" ]; then
            echo "::warning::Optional AI runtime verification did not pass. Core build remains valid; inspect the ai-runtime-diagnostics artifact."
          fi

      - name: 📤 Upload AI Runtime Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-runtime-diagnostics-${{ github.run_id }}
          path: ai-ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 🛑 Tear Down Services
        if: always()
        run: |
          docker compose --profile core --profile ai down -v

      - name: 📄 Archive Audit Certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-certificate
          path: audit_reports/*.md
          if-no-files-found: warn
