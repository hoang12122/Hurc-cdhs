name: Platform Production Readiness Attestation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  attest-production-readiness:
    name: Verify and attest Phase 1-4 production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CI: 'true'
      NODE_ENV: production
      PLATFORM_DEPLOYMENT_MODE: production
      DATA_PLATFORM_PHASE: '4'
      AI_RUNTIME_PROFILE: STANDARD
      AI_ASSURANCE_PROFILE: HIGH
      PLATFORM_REQUIRE_IMAGE_DIGEST: 'true'
      MQTT_IMAGE: ${{ vars.MQTT_IMAGE }}
      TIMESCALE_IMAGE: ${{ vars.TIMESCALE_IMAGE }}
      IOT_INGESTOR_IMAGE: ${{ vars.IOT_INGESTOR_IMAGE }}
      ETL_NORMALIZER_IMAGE: ${{ vars.ETL_NORMALIZER_IMAGE }}
      ETL_TIMESCALE_SINK_IMAGE: ${{ vars.ETL_TIMESCALE_SINK_IMAGE }}
      ETL_REPLAY_WORKER_IMAGE: ${{ vars.ETL_REPLAY_WORKER_IMAGE }}
      ETL_ACCEPTED_RELAY_IMAGE: ${{ vars.ETL_ACCEPTED_RELAY_IMAGE }}
      SCADA_GATEWAY_IMAGE: ${{ vars.SCADA_GATEWAY_IMAGE }}
      VISION_TRAINER_IMAGE: ${{ vars.VISION_TRAINER_IMAGE }}
      REDPANDA_IMAGE: ${{ vars.REDPANDA_IMAGE }}
      REDPANDA_CONNECT_IMAGE: ${{ vars.REDPANDA_CONNECT_IMAGE }}
      MINIO_IMAGE: ${{ vars.MINIO_IMAGE }}
      MINIO_MC_IMAGE: ${{ vars.MINIO_MC_IMAGE }}
      CLICKHOUSE_IMAGE: ${{ vars.CLICKHOUSE_IMAGE }}
      MLFLOW_IMAGE: ${{ vars.MLFLOW_IMAGE }}
      BESU_IMAGE: ${{ vars.BESU_IMAGE }}
      EVIDENCE_LEDGER_IMAGE: ${{ vars.EVIDENCE_LEDGER_IMAGE }}
      OUTBOX_RELAY_IMAGE: ${{ vars.OUTBOX_RELAY_IMAGE }}
      MQTT_ALLOW_ANONYMOUS: ${{ vars.MQTT_ALLOW_ANONYMOUS }}
      IOT_REQUIRE_TLS: ${{ vars.IOT_REQUIRE_TLS }}
      IOT_DEVICE_IDENTITY_ENFORCED: ${{ vars.IOT_DEVICE_IDENTITY_ENFORCED }}
      SCADA_GATEWAY_ENABLED: ${{ vars.SCADA_GATEWAY_ENABLED }}
      SCADA_READ_ONLY_VALIDATED: ${{ vars.SCADA_READ_ONLY_VALIDATED }}
      SCADA_SECURITY_REVIEW_APPROVED: ${{ vars.SCADA_SECURITY_REVIEW_APPROVED }}
      KAFKA_BROKERS: ${{ vars.KAFKA_BROKERS }}
      REDPANDA_REPLICATION_FACTOR: ${{ vars.REDPANDA_REPLICATION_FACTOR }}
      CLICKHOUSE_NODE_COUNT: ${{ vars.CLICKHOUSE_NODE_COUNT }}
      OUTBOX_MIGRATION_APPLIED: ${{ vars.OUTBOX_MIGRATION_APPLIED }}
      ETL_SCHEMA_CONTRACT_VALIDATED: ${{ vars.ETL_SCHEMA_CONTRACT_VALIDATED }}
      ETL_SCHEMA_REGISTRY_REQUIRED: ${{ vars.ETL_SCHEMA_REGISTRY_REQUIRED }}
      ETL_CANONICAL_INGRESS_VERIFIED: ${{ vars.ETL_CANONICAL_INGRESS_VERIFIED }}
      ETL_EFFECTIVELY_ONCE_TESTED: ${{ vars.ETL_EFFECTIVELY_ONCE_TESTED }}
      ETL_LATE_DATA_POLICY_APPROVED: ${{ vars.ETL_LATE_DATA_POLICY_APPROVED }}
      ETL_REPLAY_TESTED: ${{ vars.ETL_REPLAY_TESTED }}
      ETL_DATA_QUALITY_SLO_APPROVED: ${{ vars.ETL_DATA_QUALITY_SLO_APPROVED }}
      MLFLOW_BACKEND_STORE_URI: ${{ secrets.MLFLOW_BACKEND_STORE_URI }}
      MLFLOW_ARTIFACT_ROOT: ${{ vars.MLFLOW_ARTIFACT_ROOT }}
      MODEL_APPROVAL_WORKFLOW_ENABLED: ${{ vars.MODEL_APPROVAL_WORKFLOW_ENABLED }}
      VISION_TRAINING_ENABLED: ${{ vars.VISION_TRAINING_ENABLED }}
      VISION_MODEL_ACTIVE: ${{ vars.VISION_MODEL_ACTIVE }}
      VISION_DATASET_REVIEW_APPROVED: ${{ vars.VISION_DATASET_REVIEW_APPROVED }}
      VISION_MODEL_VALIDATION_APPROVED: ${{ vars.VISION_MODEL_VALIDATION_APPROVED }}
      BESU_NETWORK: ${{ vars.BESU_NETWORK }}
      LEDGER_SIGNER_MODE: ${{ vars.LEDGER_SIGNER_MODE }}
      PLATFORM_KMS_PROVIDER: ${{ vars.PLATFORM_KMS_PROVIDER }}
      LEDGER_EXTERNAL_SIGNER_URL: ${{ secrets.LEDGER_EXTERNAL_SIGNER_URL }}
      PLATFORM_IMAGES_PINNED: ${{ vars.PLATFORM_IMAGES_PINNED }}
      PLATFORM_BENCHMARK_APPROVED: ${{ vars.PLATFORM_BENCHMARK_APPROVED }}
      PLATFORM_SECURITY_REVIEW_APPROVED: ${{ vars.PLATFORM_SECURITY_REVIEW_APPROVED }}
      PLATFORM_BACKUP_RESTORE_TESTED: ${{ vars.PLATFORM_BACKUP_RESTORE_TESTED }}
      PLATFORM_DR_TESTED: ${{ vars.PLATFORM_DR_TESTED }}
      NEXT_PUBLIC_SETUP_COMPLETE: 'true'
      SESSION_SECRET: ci_placeholder_session_value
      AUTH_DATABASE_URL: postgresql://build:placeholder@localhost:5432/auth
      AI_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ai
      METRO_DATABASE_URL: postgresql://build:placeholder@localhost:5432/metro
      OPS_DATABASE_URL: postgresql://build:placeholder@localhost:5432/ops
      DATABASE_URL: postgresql://build:placeholder@localhost:5432/main

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Validate Compose and schemas
        run: |
          npm run platform:config
          npm run db:validate:all

      - name: Verify canonical ETL architecture
        run: node scripts/check-etl-architecture.mjs

      - name: Verify Vision and SCADA safety contracts
        run: node scripts/check-vision-scada-contracts.mjs

      - name: Verify Python syntax
        run: >-
          python3 -m py_compile
          infra/etl-normalizer/contract.py infra/etl-normalizer/registry.py infra/etl-normalizer/main.py
          infra/timescale-sink/store.py infra/timescale-sink/main.py
          infra/etl-replay-worker/config.py infra/etl-replay-worker/control.py
          infra/etl-replay-worker/replay.py infra/etl-replay-worker/main.py
          infra/etl-accepted-relay/main.py infra/iot-ingestor/entrypoint.py
          infra/vision-trainer/main.py infra/scada-gateway/main.py

      - name: Verify ETL contract invariants
        run: python3 -m unittest infra/etl-normalizer/test_contract.py

      - name: Verify operational data exchange contract
        run: npx tsx src/scripts/test-data-exchange.ts

      - name: Audit immutable Phase 1-4 images
        run: node scripts/check-platform-image-pins.mjs

      - name: Run acceptance tests
        run: |
          npm run typecheck
          npm run test:ai-governance
          npm run test:ai-profiles
          npm run test:continuous-learning
          npm run test:platform-profiles
          npm run test:digital-twin-health
          npm run test:platform-readiness
          npm run lint

      - name: Build production application
        run: npm run build

      - name: Smoke test production routes
        run: node scripts/production-smoke-test.js

      - name: Audit production dependencies
        run: node scripts/production-dependency-audit.js
        env:
          PRODUCTION_AUDIT_FAIL_LEVELS: high,critical

      - name: Emit Phase 1-4 attestation
        id: attestation
        continue-on-error: true
        env:
          PLATFORM_CI_ACCEPTANCE_PASSED: 'true'
          APP_COMMIT_SHA: ${{ github.sha }}
          PLATFORM_ATTESTATION_COMMIT_SHA: ${{ github.sha }}
        run: npm run platform:production:attest

      - name: Publish attestation summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = '.build-logs/platform-production-attestation.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Platform Production Readiness\n\nAttestation was not generated.\n');
            process.exit(0);
          }
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          let text = `## Platform Production Readiness: ${data.status}\n\n`;
          text += `Commit: \`${data.commitSha}\`\n\n`;
          text += '| Phase | Status | Score |\n|---:|---|---:|\n';
          for (const phase of data.phases) text += `| ${phase.phase} | ${phase.ready ? 'READY' : 'NOT READY'} | ${phase.score} |\n`;
          if (data.missingControls?.length) text += `\nMissing controls: ${data.missingControls.join(', ')}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          NODE

      - name: Upload production readiness attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-production-attestation-${{ github.run_id }}
          path: .build-logs/platform-production-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce attestation result
        if: always()
        run: |
          if [ "${{ steps.attestation.outcome }}" != "success" ]; then
            echo "Phase 1-4 are not approved for production."
            exit 1
          fi
          echo "Phase 1-4 are PRODUCTION_READY for commit $GITHUB_SHA."
