services:
  postgres:
    image: postgres:15-alpine
    container_name: hurc_postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hurc123}
      POSTGRES_DB: ${DATABASE_NAME:-hurc_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  mongo:
    image: mongo:7
    container_name: hurc_mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    profiles: ["core"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-hurc123}
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping:1})' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: hurc_redis
    restart: unless-stopped
    profiles: ["core"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hurc_app
    ports:
      - "3000:3000"
    restart: unless-stopped
    profiles: ["core"]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SETUP_COMPLETE: ${NEXT_PUBLIC_SETUP_COMPLETE:-true}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-local-dev-secret}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://postgres:hurc123@postgres:5432/hurc_auth}
      AI_DATABASE_URL: ${AI_DATABASE_URL:-postgresql://postgres:hurc123@postgres:5432/hurc_ai}
      METRO_DATABASE_URL: ${METRO_DATABASE_URL:-postgresql://postgres:hurc123@postgres:5432/hurc_metro}
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:-postgresql://postgres:hurc123@postgres:5432/hurc_ops}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:hurc123@postgres:5432/hurc_db}
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:hurc123@mongo:27017/hurc?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./audit_reports:/app/audit_reports
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  gis-bim-import-dry-run:
    image: node:20-slim
    container_name: hurc_gis_bim_import_dry_run
    profiles: ["tools"]
    working_dir: /workspace
    command: sh -c "npm ci --legacy-peer-deps --ignore-scripts && npm run import:gis-bim:dry-run"
    volumes:
      - ./:/workspace
    networks:
      - backend-net

  gis-bim-import-commit:
    image: node:20-slim
    container_name: hurc_gis_bim_import_commit
    profiles: ["tools"]
    working_dir: /workspace
    command: sh -c "npm ci --legacy-peer-deps --ignore-scripts && npm run import:gis-bim:commit"
    environment:
      METRO_DATABASE_URL: ${METRO_DATABASE_URL:-postgresql://postgres:hurc123@postgres:5432/hurc_metro}
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  nginx:
    image: nginx:alpine
    container_name: hurc_nginx
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend-net

  yolo-service:
    build:
      context: ./infra/yolo
    container_name: hurc_yolo
    restart: unless-stopped
    profiles: ["ai"]
    expose:
      - "5005"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-private-net
      - backend-net

  ollama:
    image: ollama/ollama:latest
    container_name: hurc_ollama
    restart: unless-stopped
    profiles: ["ai"]
    expose:
      - "11434"
    environment:
      OLLAMA_MODELS: /models
      HURC_MODEL_SOURCE: internal-preloaded-only
    volumes:
      - ./data/ollama:/root/.ollama
      - ./models/approved:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ai-private-net
      - backend-net

  loki:
    image: grafana/loki:latest
    container_name: hurc_loki
    restart: unless-stopped
    profiles: ["obs"]
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: hurc_grafana
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-hurc123}
    networks:
      - frontend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
  ai-private-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
